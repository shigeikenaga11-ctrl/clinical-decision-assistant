<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Clinical Decision Assistant | Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b42;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:19px 22px}header h1{font-size:19px;margin:0}header small{color:#c5d5e4}main{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid #dbe3ed;border-radius:15px;padding:22px;margin-bottom:14px;box-shadow:0 3px 14px #10243a09}.muted{color:#607084;font-size:13px}.options{display:grid;gap:10px;margin-top:18px}.option{border:1px solid #cdd9e7;background:#fff;border-radius:10px;text-align:left;padding:14px;font-size:16px;cursor:pointer;color:#142c44}.option:hover,.option:focus{background:#e8f2ff;border-color:#397fc7}.option.selected{background:#dceeff;border-color:#176cb5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{font:inherit}.primary,.secondary{border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.primary{background:#1268ac;color:white}.secondary{background:#e8eef5;color:#17324d}.primary:disabled{opacity:.45;cursor:not-allowed}.progress{height:7px;background:#e4eaf2;border-radius:6px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#2c84bf}.tag{display:inline-block;border-radius:30px;background:#e9eff7;padding:5px 10px;font-size:12px}.red{color:#9c1d25;background:#ffebeb}.yellow{color:#795900;background:#fff3c9}.green{color:#12613a;background:#e4f7ed}li{margin:7px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:14px;border-radius:10px;line-height:1.6;font-family:inherit}.warning{border-left:4px solid #d8a32c;padding:10px 14px;background:#fff9e7;font-size:13px}.disease-group{border:1px solid #dbe3ed;border-radius:10px;margin:9px 0;padding:10px 13px}.disease-group summary{cursor:pointer;font-weight:700}.disease-item{margin:9px 0}.disease-item button{border:0;background:#e8eef5;border-radius:6px;padding:5px 9px;cursor:pointer}.subtype{margin:8px 0 8px 16px;padding:10px;background:#f5f8fc;border-radius:8px}.hidden{display:none}footer{text-align:center;color:#65758a;font-size:12px;padding:15px}
</style></head><body><header><h1>Clinical Decision Assistant <span class="tag">DEMO</span></h1><small>医師向け選択式問診・診断支援｜模擬症例専用</small></header><main><section class="panel"><strong id="heading">主訴を選択</strong><div class="progress"><div id="progress" style="width:0%"></div></div><p class="muted" id="counter">選択肢だけで進みます。実患者には使用しないでください。</p><h2 id="question" style="font-size:20px">主訴は何ですか？</h2><div id="options" class="options"></div><div class="actions"><button class="secondary" id="back" type="button">戻る</button><button class="primary hidden" id="next" type="button">次へ</button><button class="secondary" id="restart" type="button">最初から</button></div></section><section id="results" class="panel hidden" aria-live="polite"></section><section class="warning">教育・UI検証用の試作です。緊急度・鑑別・検査候補は網羅的でも検証済みでもありません。バイタル・身体診察・背景因子を評価せず、診断や処置を決定しないでください。個人情報を入力しないでください。</section></main><footer>Static demo • No server • No external API • No storage</footer><script>
'use strict';
const Q={
 fever:[{id:'onset',label:'発症時期',choices:['24時間以内','2〜3日前','4日以上']},{id:'temp',label:'最高体温',choices:['37℃台','38〜39℃未満','39℃以上','未測定']},{id:'feverAssoc',label:'随伴症状',multi:true,choices:['咳・咽頭痛','排尿時痛・頻尿','腹痛','発疹','なし']},{id:'feverDanger',label:'危険徴候',multi:true,choices:['意識変容','呼吸困難','頸部硬直','循環不全を疑う所見','なし','未評価']}],
 headache:[{id:'onset',label:'発症時期',choices:['突然（瞬時にピーク）','数時間〜数日','慢性的']},{id:'headType',label:'頭痛の特徴',choices:['拍動性','締め付け感','後頭部・頸部痛','その他']},{id:'headAssoc',label:'随伴症状',multi:true,choices:['悪心・光過敏','発熱','視覚症状','なし']},{id:'headDanger',label:'危険徴候',multi:true,choices:['突然の最悪の頭痛','新たな神経脱落症状','意識変容','発熱＋項部硬直','なし','未評価']}],
 abdomen:[{id:'onset',label:'発症時期',choices:['突然','数時間〜数日','1週間以上']},{id:'abdSite',label:'痛みの部位',choices:['右上腹部','右下腹部','心窩部','下腹部','全体・不明']},{id:'abdAssoc',label:'随伴症状',multi:true,choices:['嘔吐','下痢','発熱','血便・黒色便','なし']},{id:'abdDanger',label:'危険徴候',multi:true,choices:['腹膜刺激徴候','循環不全を疑う所見','持続する激痛','吐血・大量下血','なし','未評価']}],
 chest:[{id:'onset',label:'発症時期',choices:['突然','数時間以内','数日以上']},{id:'chestType',label:'胸痛の特徴',choices:['圧迫・絞扼感','吸気で増悪','体動・圧迫で増悪','その他']},{id:'chestAssoc',label:'随伴症状',multi:true,choices:['呼吸困難','冷汗','失神','発熱・咳','なし']},{id:'chestDanger',label:'危険徴候',multi:true,choices:['持続する強い胸痛','呼吸困難','失神','循環不全を疑う所見','なし','未評価']}],
 cough:[{id:'onset',label:'発症時期',choices:['3日以内','4日〜3週間','3週間超']},{id:'coughType',label:'咳の特徴',choices:['乾性','湿性','血痰あり']},{id:'coughAssoc',label:'随伴症状',multi:true,choices:['発熱','喘鳴','鼻汁・咽頭痛','なし']},{id:'coughDanger',label:'危険徴候',multi:true,choices:['強い呼吸困難','喀血','意識変容','低酸素を疑う所見','なし','未評価']}]
};
const names={fever:'発熱',headache:'頭痛',abdomen:'腹痛',chest:'胸痛',cough:'咳'};
const rules={
 fever:{d:['ウイルス感染症','肺炎','尿路感染症','菌血症・敗血症（重症例）'],t:['バイタル・SpO₂','身体診察','必要に応じて血算・CRP','感染巣に応じて尿検査・画像検査']},
 headache:{d:['片頭痛','緊張型頭痛','くも膜下出血（危険徴候がある場合）','髄膜炎（発熱・項部硬直がある場合）'],t:['神経学的診察','バイタル','危険徴候があれば緊急頭部画像などを検討']},
 abdomen:{d:['胃腸炎','虫垂炎','胆嚢炎・胆石症','消化管穿孔・腸閉塞（重症例）'],t:['腹部診察・バイタル','必要に応じて血算・生化学・尿検査','病態に応じて腹部超音波・CT']},
 chest:{d:['急性冠症候群','肺塞栓症','大動脈解離','気胸','筋骨格性胸痛'],t:['直ちにバイタル・SpO₂・12誘導心電図を検討','急性冠症候群疑いではトロポニン等','病態に応じて胸部画像・追加検査']},
 cough:{d:['上気道感染症','気管支炎','肺炎','喘息','結核など（遷延時）'],t:['バイタル・SpO₂・呼吸音','肺炎疑いでは胸部X線等','遷延・血痰では追加精査を検討']}
};
// Categories are non-exclusive. These are educational differential lists, not diagnostic probabilities.
const diseaseGroups={
 fever:[['感染症',['ウイルス感染症','肺炎','尿路感染症','菌血症・敗血症']],['非感染性',['薬剤熱','自己免疫性疾患']]],
 headache:[['一次性頭痛',['片頭痛','緊張型頭痛','群発頭痛']],['二次性頭痛',['くも膜下出血','髄膜炎','脳血管障害']]],
 abdomen:[['消化管',['胃腸炎','虫垂炎','腸閉塞','消化管穿孔']],['肝胆膵',['胆嚢炎・胆石症','急性膵炎']],['泌尿器・婦人科',['尿管結石','異所性妊娠（該当時）']]],
 chest:[['循環器',['急性冠症候群','心不全','大動脈解離','心膜炎']],['呼吸器',['肺塞栓症','気胸','肺炎']],['その他',['筋骨格性胸痛','逆流性食道炎']]],
 cough:[['感染症',['上気道感染症','気管支炎','肺炎','結核']],['気道疾患',['喘息','COPD']],['循環器',['心不全']],['その他',['薬剤性咳嗽','間質性肺疾患']]]
};
const diseaseDetails={
 '心不全':{overview:'心不全は症候群。問診のみで確定・病型分類はできません。',dimensions:[
 ['経過',['急性心不全','慢性心不全','慢性心不全の急性増悪']],
 ['LVEF分類（心エコー等が必要）',['HFrEF：40%以下','HFmrEF：41〜49%','HFpEF：50%以上（他の診断根拠も必要）','HFimpEF：以前40%以下、改善後40%超かつ10ポイント超改善']],
 ['原因の候補',['虚血性','高血圧性','弁膜症性','心筋症','不整脈関連']],
 ['機能分類・病期',['NYHA I〜IV','ACC/AHA Stage A〜D']]
 ],followup:['呼吸困難・起坐呼吸・夜間発作性呼吸困難','下腿浮腫・体重増加','既往心疾患・不整脈','血圧・脈拍・SpO₂・呼吸数','胸部X線・心電図・BNP/NT-proBNP・心エコー等を状況に応じ検討']}
};
function appendDifferentials(root){const h=document.createElement('h3');h.textContent='カテゴリー別鑑別候補（選択して詳細表示）';root.append(h);diseaseGroups[chief].forEach(([group,items])=>{const details=document.createElement('details');details.className='disease-group';details.open=true;const summary=document.createElement('summary');summary.textContent=group;details.append(summary);items.forEach(name=>{const div=document.createElement('div');div.className='disease-item';const btn=document.createElement('button');btn.type='button';btn.textContent=name+' ▾';div.append(btn);const info=document.createElement('div');info.className='subtype hidden';const detail=diseaseDetails[name];if(detail){const p=document.createElement('p');p.textContent=detail.overview;info.append(p);detail.dimensions.forEach(([label,values])=>{const b=document.createElement('strong');b.textContent=label;info.append(b);const ul=document.createElement('ul');values.forEach(v=>{const li=document.createElement('li');li.textContent=v;ul.append(li)});info.append(ul)});const b=document.createElement('strong');b.textContent='追加問診・評価項目';info.append(b);const ul=document.createElement('ul');detail.followup.forEach(v=>{const li=document.createElement('li');li.textContent=v;ul.append(li)});info.append(ul)}else{info.textContent='詳細分類は今後追加予定。確定診断ではありません。'}btn.onclick=()=>{info.classList.toggle('hidden');btn.textContent=name+(info.classList.contains('hidden')?' ▾':' ▴')};div.append(info);details.append(div)});root.append(details)})}
const red={fever:['意識変容','呼吸困難','頸部硬直','循環不全を疑う所見'],headache:['突然の最悪の頭痛','新たな神経脱落症状','意識変容','発熱＋項部硬直'],abdomen:['腹膜刺激徴候','循環不全を疑う所見','持続する激痛','吐血・大量下血'],chest:['持続する強い胸痛','呼吸困難','失神','循環不全を疑う所見'],cough:['強い呼吸困難','喀血','意識変容','低酸素を疑う所見']};
let chief=null,idx=0,answers={},selected=[];const $=id=>document.getElementById(id);
function reset(){chief=null;idx=0;answers={};selected=[];$('results').classList.add('hidden');render()}
function options(choices,multi,callback){$('options').replaceChildren();choices.forEach(choice=>{let b=document.createElement('button');b.type='button';b.className='option'+(selected.includes(choice)?' selected':'');b.textContent=choice;b.setAttribute('aria-pressed',selected.includes(choice)?'true':'false');b.onclick=()=>callback(choice);$('options').append(b)})}
function render(){const start=!chief;$('results').classList.add('hidden');$('heading').textContent=start?'主訴を選択':names[chief]+'：選択式問診';$('counter').textContent=start?'最初に主訴を選択してください':`質問 ${idx+1} / ${Q[chief].length}`;$('progress').style.width=start?'0%':`${100*idx/Q[chief].length}%`;$('back').disabled=start;$('next').classList.add('hidden');if(start){$('question').textContent='主訴は何ですか？';options(Object.values(names),false,c=>{chief=Object.keys(names).find(k=>names[k]===c);idx=0;render()});return}const q=Q[chief][idx];$('question').textContent=q.label+(q.multi?'（複数選択可）':'');selected=Array.isArray(answers[q.id])?[...answers[q.id]]:[];const handleChoice=c=>{if(q.multi){if(c==='なし'||c==='未評価'){selected=[c]}else{selected=selected.filter(x=>x!=='なし'&&x!=='未評価');selected=selected.includes(c)?selected.filter(x=>x!==c):[...selected,c]}options(q.choices,true,handleChoice);$('next').classList.toggle('hidden',selected.length===0)}else{answers[q.id]=c;advance()}};options(q.choices,!!q.multi,handleChoice);if(q.multi){$('next').classList.toggle('hidden',selected.length===0)} }
function advance(){if(idx<Q[chief].length-1){idx++;render()}else{showResults()}}
$('next').onclick=()=>{const q=Q[chief][idx];if(!selected.length)return;answers[q.id]=[...selected];advance()};
$('back').onclick=()=>{if(!chief)return;if(idx===0){chief=null;answers={}}else idx--;render()};$('restart').onclick=reset;
function showResults(){const d=Object.values(answers).flat();const danger=red[chief].filter(x=>d.includes(x));const unknown=d.includes('未評価');const caution=chief==='chest'||(chief==='headache'&&answers.onset==='突然（瞬時にピーク）')||(chief==='abdomen'&&answers.onset==='突然')||answers.coughType==='血痰あり'||d.includes('39℃以上');const level=danger.length?'red':(unknown||caution?'yellow':'green');const status=level==='red'?'危険徴候あり：緊急評価を検討':level==='yellow'?'要注意：追加評価が必要':'入力上の危険徴候なし（除外不能）';const q=Q[chief];const history=q.map(x=>x.label+'：'+(Array.isArray(answers[x.id])?answers[x.id].join('、'):answers[x.id]||'未回答')).join('\n');const soap=`S（主観的情報）\n主訴：${names[chief]}\n${history}\n\nO（客観的情報）\nバイタル・身体診察・検査所見：未入力／未評価\n\nA（評価：確定診断ではない）\n注意喚起：${status}\n鑑別候補（順位・確率を示さない）：${diseaseGroups[chief].flatMap(g=>g[1]).join('、')}\n\nP（計画案：医師の判断が必要）\n${rules[chief].t.map(x=>'・'+x).join('\n')}\n※模擬症例の下書き。臨床利用不可。`;const root=$('results');root.replaceChildren();const h=document.createElement('h2');h.textContent='問診結果';root.append(h);const badge=document.createElement('span');badge.className='tag '+level;badge.textContent=status;root.append(badge);if(danger.length){const p=document.createElement('p');p.textContent='該当する危険徴候：'+danger.join('、');root.append(p)}const note=document.createElement('p');note.className='muted';note.textContent='これは固定ルールによる教育用候補です。診断順位や確率ではありません。';root.append(note);appendDifferentials(root);[['検査・評価候補',rules[chief].t]].forEach(([label,items])=>{const title=document.createElement('h3');title.textContent=label;root.append(title);const ul=document.createElement('ul');items.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.append(li)});root.append(ul)});const title=document.createElement('h3');title.textContent='SOAP下書き';root.append(title);const pre=document.createElement('pre');pre.textContent=soap;root.append(pre);const b=document.createElement('button');b.className='primary';b.textContent='SOAPをコピー';b.onclick=async()=>{try{await navigator.clipboard.writeText(soap);b.textContent='コピーしました'}catch(e){b.textContent='コピーできません。テキストを選択してください'}};root.append(b);root.classList.remove('hidden');$('question').textContent='問診完了';$('options').replaceChildren();$('heading').textContent='結果';$('counter').textContent='模擬症例のみ';$('progress').style.width='100%';$('next').classList.add('hidden');root.scrollIntoView({behavior:'smooth',block:'start'})}
render();
</script></body></html>
