
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Decision Assistant v1.3</title>
<style>
:root{
  font-family:system-ui,-apple-system,sans-serif;
  color:#172b42;
  background:#f3f6fa;
}
*{box-sizing:border-box}
body{margin:0}
header{background:#10243a;color:white;padding:20px}
header h1{font-size:20px;margin:0 0 5px}
header small{color:#c5d5e4}
main{max-width:850px;margin:22px auto;padding:0 14px}
.panel{
  background:white;border:1px solid #dbe3ed;
  border-radius:15px;padding:22px;margin-bottom:14px;
}
.muted{color:#607084;font-size:13px}
.options{display:grid;gap:10px;margin-top:18px}
.option{
  border:1px solid #cdd9e7;background:white;
  border-radius:10px;text-align:left;padding:14px;
  font-size:16px;cursor:pointer;color:#142c44;
}
.option:hover,.option:focus{background:#e8f2ff}
.option.selected{background:#dceeff;border-color:#176cb5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
button{font:inherit}
.primary,.secondary{
  border:0;border-radius:9px;padding:11px 16px;cursor:pointer;
}
.primary{background:#1268ac;color:white}
.secondary{background:#e8eef5;color:#17324d}
button:disabled{opacity:.45;cursor:not-allowed}
.progress{
  height:7px;background:#e4eaf2;
  border-radius:6px;overflow:hidden;margin-top:14px;
}
#progress{height:100%;background:#2c84bf;width:0}
.tag{
  display:inline-block;border-radius:30px;
  padding:6px 12px;background:#e9eff7;font-size:13px;
}
.red{color:#9c1d25;background:#ffebeb}
.yellow{color:#795900;background:#fff3c9}
.warning{
  border-left:4px solid #d8a32c;
  padding:12px;background:#fff9e7;font-size:13px;
}
.disease-group{
  border:1px solid #dbe3ed;border-radius:10px;
  margin:9px 0;padding:10px 13px;
}
.disease-group summary{cursor:pointer;font-weight:bold}
.disease-item{margin:10px 0}
.disease-item button{
  border:0;background:#e8eef5;
  border-radius:6px;padding:7px 10px;cursor:pointer;
}
.subtype{
  margin:8px 0 8px 12px;padding:12px;
  background:#f5f8fc;border-radius:8px;
}
pre{
  white-space:pre-wrap;overflow-wrap:anywhere;
  background:#f5f7fa;padding:14px;border-radius:10px;
  line-height:1.6;font-family:inherit;
}
.hidden{display:none}
li{margin:7px 0}
footer{text-align:center;color:#65758a;font-size:12px;padding:18px}
</style>
</head>
<body>
<header>
<h1>Clinical Decision Assistant <span class="tag">v1.3 DEMO</span></h1>
<small>選択式問診・鑑別候補・SOAP下書き｜模擬症例専用</small>
</header>
<main>
<section class="panel">
<strong id="heading">主訴を選択</strong>
<div class="progress"><div id="progress"></div></div>
<p id="counter" class="muted"></p>
<h2 id="question">主訴は何ですか？</h2>
<div id="options" class="options"></div>
<div class="actions">
<button class="secondary" id="back" type="button">戻る</button>
<button class="primary hidden" id="next" type="button">次へ</button>
<button class="secondary" id="restart" type="button">最初から</button>
</div>
</section>
<section id="results" class="panel hidden" aria-live="polite"></section>
<section class="warning">
教育・UI検証用の試作です。診断、緊急度、検査候補は臨床的に
検証されていません。実患者の診療や個人情報の入力には使用しないでください。
</section>
</main>
<footer>GitHub Pages · Static demo · No external API · No storage</footer>

<script>
"use strict";

const $=id=>document.getElementById(id);

const names={
 fever:"発熱",headache:"頭痛",abdomen:"腹痛",
 chest:"胸痛",cough:"咳",dyspnea:"呼吸困難"
};

const question=(id,label,choices,multi=false,when=null)=>({
 id,label,choices,multi,when
});

const has=(a,id,value)=>{
 const v=a[id];
 return Array.isArray(v)?v.includes(value):v===value;
};

const heartFailureBranch=a=>
 ["心不全あり","虚血性心疾患あり","弁膜症・心筋症あり"]
 .includes(a.hf) ||
 ["起坐呼吸","夜間発作性呼吸困難","下腿浮腫"]
 .some(x=>has(a,"assoc",x));

const Q={
 fever:[
  question("onset","発症時期",["24時間以内","2〜3日前","4日以上"]),
  question("temp","最高体温",["37℃台","38〜39℃未満","39℃以上","未測定"]),
  question("assoc","随伴症状",["咳・咽頭痛","排尿時痛・頻尿","腹痛","発疹","なし"],true),
  question("danger","危険徴候",["意識変容","呼吸困難","頸部硬直","循環不全を疑う所見","なし","未評価"],true)
 ],
 headache:[
  question("onset","発症時期",["突然（瞬時にピーク）","数時間〜数日","慢性的"]),
  question("type","頭痛の特徴",["拍動性","締め付け感","後頭部・頸部痛","その他"]),
  question("assoc","随伴症状",["悪心・光過敏","発熱","視覚症状","なし"],true),
  question("danger","危険徴候",["突然の最悪の頭痛","新たな神経脱落症状","意識変容","発熱＋項部硬直","なし","未評価"],true)
 ],
 abdomen:[
  question("onset","発症時期",["突然","数時間〜数日","1週間以上"]),
  question("site","痛みの部位",["右上腹部","右下腹部","心窩部","下腹部","全体・不明"]),
  question("assoc","随伴症状",["嘔吐","下痢","発熱","血便・黒色便","なし"],true),
  question("danger","危険徴候",["腹膜刺激徴候","循環不全を疑う所見","持続する激痛","吐血・大量下血","なし","未評価"],true)
 ],
 chest:[
  question("onset","発症時期",["突然","数時間以内","数日以上"]),
  question("type","胸痛の特徴",["圧迫・絞扼感","吸気で増悪","体動・圧迫で増悪","その他"]),
  question("assoc","随伴症状",["呼吸困難","冷汗","失神","発熱・咳","なし"],true),
  question("danger","危険徴候",["持続する強い胸痛","呼吸困難","失神","循環不全を疑う所見","なし","未評価"],true)
 ],
 cough:[
  question("onset","発症時期",["3日以内","4日〜3週間","3週間超"]),
  question("type","咳の特徴",["乾性","湿性","血痰あり"]),
  question("assoc","随伴症状",["発熱","喘鳴","鼻汁・咽頭痛","なし"],true),
  question("danger","危険徴候",["強い呼吸困難","喀血","意識変容","低酸素を疑う所見","なし","未評価"],true)
 ],
 dyspnea:[
  question("onset","呼吸困難の発症時期",[
   "突然（数分以内）","数時間前から","数日前から","数週間以上前から"
  ]),
  question("rest","呼吸困難の程度",[
   "安静時にもある","労作時のみ","現在は改善している"
  ]),
  question("assoc","随伴症状",[
   "胸痛","発熱・咳","起坐呼吸","夜間発作性呼吸困難",
   "下腿浮腫","喘鳴","片側下肢腫脹","なし"
  ],true),
  question("spo2","SpO₂（測定条件は別途確認）",[
   "90%未満","90〜93%","94〜95%","96%以上","未測定"
  ]),
  question("hf","心疾患・心不全の既往",[
   "心不全あり","虚血性心疾患あり","弁膜症・心筋症あり","なし","不明"
  ],false,a=>heartFailureBranch(a)),

  // 心不全の追加5質問
  question("hfCourse","心不全に関連する症状の経過",[
   "急激に悪化","数日かけて悪化",
   "数週間以上かけて悪化","以前から同程度","不明"
  ],false,a=>heartFailureBranch(a)),

  question("hfCongestion","うっ血を示唆する症状",[
   "最近の体重増加","下腿浮腫の増悪",
   "起坐呼吸","夜間発作性呼吸困難",
   "腹部膨満","なし","未評価"
  ],true,a=>heartFailureBranch(a)),

  question("hfEtiology","心不全の原因に関連する既往",[
   "冠動脈疾患","高血圧","弁膜症","心筋症",
   "心房細動などの不整脈","なし","未評価"
  ],true,a=>heartFailureBranch(a)),

  question("hfLvef","既存の心エコーで確認されたLVEF",[
   "40%以下","41〜49%","50%以上",
   "検査済みだが不明","未検査"
  ],false,a=>heartFailureBranch(a)),

  question("hfFunction","日常生活での活動制限",[
   "通常の活動で症状なし",
   "通常の活動で症状あり",
   "軽い活動でも症状あり",
   "安静時にも症状あり",
   "評価困難"
  ],false,a=>heartFailureBranch(a)),

  question("lung","呼吸器疾患の既往",[
   "喘息","COPD","間質性肺疾患","なし","不明"
  ],false,a=>has(a,"assoc","喘鳴")),

  question("pe","肺塞栓症のリスク因子",[
   "最近の手術・長期臥床","悪性腫瘍",
   "過去の静脈血栓塞栓症",
   "妊娠・産褥（該当時）","なし","未評価"
  ],true,a=>a.onset==="突然（数分以内）"||
    has(a,"assoc","片側下肢腫脹")),

  question("danger","重症徴候",[
   "意識変容","チアノーゼ",
   "会話困難・著明な呼吸努力",
   "失神","循環不全を疑う所見",
   "なし","未評価"
  ],true)
 ]
};

const diseaseGroups={
 fever:[
  ["感染症",["ウイルス感染症","肺炎","尿路感染症","菌血症・敗血症"]],
  ["非感染性",["薬剤熱","自己免疫性疾患"]]
 ],
 headache:[
  ["一次性頭痛",["片頭痛","緊張型頭痛","群発頭痛"]],
  ["二次性頭痛",["くも膜下出血","髄膜炎","脳血管障害"]]
 ],
 abdomen:[
  ["消化管",["胃腸炎","虫垂炎","腸閉塞","消化管穿孔"]],
  ["肝胆膵",["胆嚢炎・胆石症","急性膵炎"]],
  ["泌尿器・婦人科",["尿管結石","異所性妊娠（該当時）"]]
 ],
 chest:[
  ["循環器",["急性冠症候群","心不全","大動脈解離","心膜炎"]],
  ["呼吸器",["肺塞栓症","気胸","肺炎"]],
  ["その他",["筋骨格性胸痛","逆流性食道炎"]]
 ],
 cough:[
  ["感染症",["上気道感染症","気管支炎","肺炎","結核"]],
  ["気道疾患",["喘息","COPD"]],
  ["循環器",["心不全"]],
  ["その他",["薬剤性咳嗽","間質性肺疾患"]]
 ],
 dyspnea:[
  ["循環器",["心不全","急性冠症候群","不整脈"]],
  ["肺血管疾患",["肺塞栓症","肺高血圧症"]],
  ["呼吸器",["肺炎","喘息","COPD","気胸","間質性肺疾患"]],
  ["その他",["貧血","代謝性アシドーシス","過換気症候群"]]
 ]
};

const diseaseDetails={
 "心不全":{
  overview:"心不全は症候群です。問診やLVEFのみでは確定診断できません。",
  dimensions:[
   ["経過",["急性心不全","慢性心不全","慢性心不全の急性増悪"]],
   ["LVEF分類",[
    "HFrEF：40%以下",
    "HFmrEF：41〜49%",
    "HFpEF：50%以上（追加の診断根拠が必要）",
    "HFimpEF：過去40%以下で、その後40%超かつ10ポイント以上改善"
   ]],
   ["原因候補",["虚血性","高血圧性","弁膜症性","心筋症","不整脈関連"]],
   ["重症度・病期",["NYHA I〜IV","ACC/AHA Stage A〜D"]]
  ],
  followup:[
   "呼吸困難・起坐呼吸・夜間発作性呼吸困難",
   "浮腫・体重変化・心疾患の既往",
   "心電図・胸部X線・BNP/NT-proBNP・心エコー等"
  ]
 }
};

const tests={
 fever:["バイタル・SpO₂・身体診察","必要に応じて血算・CRP","感染巣に応じた尿検査・画像検査"],
 headache:["バイタル・神経学的診察","危険徴候に応じた緊急頭部画像等"],
 abdomen:["バイタル・腹部診察","血算・生化学・尿検査","病態に応じた腹部超音波・CT"],
 chest:["バイタル・SpO₂・12誘導心電図","必要に応じてトロポニン・胸部画像等"],
 cough:["バイタル・SpO₂・呼吸音","肺炎疑いで胸部画像等","遷延・血痰時の追加精査"],
 dyspnea:[
  "血圧・脈拍・呼吸数・体温・意識・呼吸仕事量・SpO₂",
  "12誘導心電図・胸部X線",
  "心不全疑い：BNP/NT-proBNP・心エコー等",
  "肺塞栓症疑い：事前確率評価に基づくDダイマー・造影CT等",
  "肺炎疑い：胸部画像・感染症関連検査等",
  "必要に応じて血液ガス・血算・生化学"
 ]
};

const red={
 fever:["意識変容","呼吸困難","頸部硬直","循環不全を疑う所見"],
 headache:["突然の最悪の頭痛","新たな神経脱落症状","意識変容","発熱＋項部硬直"],
 abdomen:["腹膜刺激徴候","循環不全を疑う所見","持続する激痛","吐血・大量下血"],
 chest:["持続する強い胸痛","呼吸困難","失神","循環不全を疑う所見"],
 cough:["強い呼吸困難","喀血","意識変容","低酸素を疑う所見"],
 dyspnea:["意識変容","チアノーゼ","会話困難・著明な呼吸努力","失神","循環不全を疑う所見"]
};

// 状態管理
let chief=null;
let currentId=null;
let answers={};
let selected=[];
let history=[];

// 回答済みの内容から質問の並びを毎回作る
function visibleQuestions(){
 if(!chief)return [];
 return Q[chief].filter(q=>!q.when||q.when(answers));
}

function reset(){
 chief=null;
 currentId=null;
 answers={};
 selected=[];
 history=[];
 $("results").classList.add("hidden");
 render();
}

function drawOptions(choices,callback){
 $("options").replaceChildren();
 choices.forEach(choice=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="option"+(selected.includes(choice)?" selected":"");
  b.textContent=choice;
  b.setAttribute("aria-pressed",String(selected.includes(choice)));
  b.onclick=()=>callback(choice);
  $("options").append(b);
 });
}

function render(){
 $("results").classList.add("hidden");
 $("next").classList.add("hidden");

 if(!chief){
  $("heading").textContent="主訴を選択";
  $("counter").textContent="最初に主訴を選択してください";
  $("question").textContent="主訴は何ですか？";
  $("progress").style.width="0%";
  $("back").disabled=true;
  selected=[];

  drawOptions(Object.values(names),choice=>{
   chief=Object.keys(names).find(k=>names[k]===choice);
   currentId=Q[chief][0].id;
   answers={};
   history=[];
   render();
  });
  return;
 }

 const qs=visibleQuestions();
 const index=qs.findIndex(q=>q.id===currentId);

 if(index<0){
  $("question").textContent="質問の位置を確認できません";
  $("counter").textContent="最初からやり直してください";
  $("options").replaceChildren();
  return;
 }

 const q=qs[index];
 $("back").disabled=false;
 $("heading").textContent=names[chief]+"：選択式問診";
 $("counter").textContent=`質問 ${index+1} / ${qs.length}`;
 $("progress").style.width=`${100*index/qs.length}%`;
 $("question").textContent=q.label+(q.multi?"（複数選択可）":"");

 selected=Array.isArray(answers[q.id])?[...answers[q.id]]:[];

 function choose(choice){
  if(q.multi){
   if(choice==="なし"||choice==="未評価"){
    selected=[choice];
   }else{
    selected=selected.filter(x=>x!=="なし"&&x!=="未評価");
    selected=selected.includes(choice)
     ?selected.filter(x=>x!==choice)
     :[...selected,choice];
   }
   drawOptions(q.choices,choose);
   $("next").classList.toggle("hidden",selected.length===0);
  }else{
   answers[q.id]=choice;
   advance();
  }
 }

 drawOptions(q.choices,choose);
 if(q.multi){
  $("next").classList.toggle("hidden",selected.length===0);
 }
}

function advance(){
 // 回答確定後に質問リストを再計算する
 const qs=visibleQuestions();
 const index=qs.findIndex(q=>q.id===currentId);

 if(index<0){
  alert("質問の進行状態に問題があります。");
  return;
 }

 const next=qs[index+1];
 if(next){
  history.push(currentId);
  currentId=next.id;
  render();
 }else{
  showResults();
 }
}

$("next").onclick=()=>{
 if(!chief||!currentId||!selected.length)return;
 answers[currentId]=[...selected];
 advance();
};

$("back").onclick=()=>{
 if(!chief)return;
 if(history.length===0){
  reset();
  return;
 }
 // 戻った先以降の回答を破棄し、分岐を再評価する
 const previous=history.pop();
 const start=Q[chief].findIndex(q=>q.id===previous);
 Q[chief].slice(start).forEach(q=>delete answers[q.id]);
 currentId=previous;
 render();
};

$("restart").onclick=reset;

// 心不全の病型に関する参考情報を整理
function heartFailureAssessment(){
 if(chief!=="dyspnea"||!heartFailureBranch(answers)){
  return [];
 }

 const result=[
  "心不全関連の追加問診が実施された。心不全の確定診断ではない。"
 ];

 const course=answers.hfCourse;
 if(course==="急激に悪化"||course==="数日かけて悪化"){
  result.push("短期間の症状悪化あり。急性心不全または慢性心不全の急性増悪を鑑別。");
 }else if(course==="数週間以上かけて悪化"){
  result.push("数週間以上の症状進行あり。慢性経過などを検討。");
 }

 const lvef=answers.hfLvef;
 if(lvef==="40%以下"){
  result.push("既報LVEFはHFrEFのEF範囲に該当。心不全診断と測定時点の確認が必要。");
 }else if(lvef==="41〜49%"){
  result.push("既報LVEFはHFmrEFのEF範囲に該当。心不全診断の確認が必要。");
 }else if(lvef==="50%以上"){
  result.push("既報LVEFは50%以上。HFpEFの診断には追加根拠が必要。");
 }else{
  result.push("LVEF分類は保留。");
 }

 if(Array.isArray(answers.hfCongestion)){
  const findings=answers.hfCongestion.filter(x=>
   x!=="なし"&&x!=="未評価"
  );
  if(findings.length){
   result.push("うっ血を示唆する申告："+findings.join("、"));
  }
 }

 if(Array.isArray(answers.hfEtiology)){
  const causes=answers.hfEtiology.filter(x=>
   x!=="なし"&&x!=="未評価"
  );
  if(causes.length){
   result.push("原因評価に関連する既往："+causes.join("、"));
  }
 }

 if(answers.hfFunction){
  result.push(
   "活動制限の申告："+answers.hfFunction+
   "。NYHA分類の確定には追加評価が必要。"
  );
 }

 return result;
}

function appendDifferentials(root){
 const h=document.createElement("h3");
 h.textContent="カテゴリー別鑑別候補";
 root.append(h);

 diseaseGroups[chief].forEach(([group,items])=>{
  const details=document.createElement("details");
  details.className="disease-group";
  details.open=true;

  const summary=document.createElement("summary");
  summary.textContent=group;
  details.append(summary);

  items.forEach(name=>{
   const item=document.createElement("div");
   item.className="disease-item";

   const button=document.createElement("button");
   button.type="button";
   button.textContent=name+" ▾";

   const info=document.createElement("div");
   info.className="subtype hidden";
   const detail=diseaseDetails[name];

   if(detail){
    const p=document.createElement("p");
    p.textContent=detail.overview;
    info.append(p);

    detail.dimensions.forEach(([label,values])=>{
     const b=document.createElement("strong");
     b.textContent=label;
     info.append(b);

     const ul=document.createElement("ul");
     values.forEach(value=>{
      const li=document.createElement("li");
      li.textContent=value;
      ul.append(li);
     });
     info.append(ul);
    });

    const b=document.createElement("strong");
    b.textContent="追加問診・評価項目";
    info.append(b);

    const ul=document.createElement("ul");
    detail.followup.forEach(value=>{
     const li=document.createElement("li");
     li.textContent=value;
     ul.append(li);
    });
    info.append(ul);
   }else{
    info.textContent="詳細分類は今後追加予定。確定診断ではありません。";
   }

   button.onclick=()=>{
    info.classList.toggle("hidden");
    button.textContent=name+
     (info.classList.contains("hidden")?" ▾":" ▴");
   };

   item.append(button,info);
   details.append(item);
  });

  root.append(details);
 });
}

function showResults(){
 const values=Object.values(answers).flat();
 const danger=red[chief].filter(x=>values.includes(x));
 const lowOxygen=chief==="dyspnea"&&
  ["90%未満","90〜93%"].includes(answers.spo2);

 const caution=
  chief==="dyspnea"||
  chief==="chest"||
  (chief==="headache"&&answers.onset==="突然（瞬時にピーク）")||
  (chief==="abdomen"&&answers.onset==="突然")||
  (chief==="cough"&&answers.type==="血痰あり")||
  values.includes("39℃以上");

 const unknown=values.includes("未評価")||
  values.includes("未測定");

 const level=danger.length||lowOxygen
  ?"red":(caution||unknown?"yellow":"green");

 const status=level==="red"
  ?"危険徴候あり：緊急評価を要する可能性"
  :level==="yellow"
   ?"追加評価が必要：重症疾患は除外不能"
   :"入力項目に明らかな危険徴候なし（除外不能）";

 const historyText=Q[chief]
  .filter(q=>Object.prototype.hasOwnProperty.call(answers,q.id))
  .map(q=>{
   const v=answers[q.id];
   return q.label+"："+(Array.isArray(v)?v.join("、"):v);
  }).join("\n");

 const differential=diseaseGroups[chief]
  .flatMap(group=>group[1]).join("、");

 const hfNotes=heartFailureAssessment();

 const soap=
`S（主観的情報）
主訴：${names[chief]}
${historyText}

O（客観的情報）
バイタル・身体診察・検査所見：未入力／未評価
※選択されたSpO₂やLVEFは申告情報であり、実測値として未検証。

A（評価：確定診断ではない）
注意喚起：${status}
鑑別候補（順位・確率ではない）：
${differential}

${hfNotes.length?
"心不全に関する参考評価：\n"+
hfNotes.map(x+"").join("\n"):""}

P（検査・評価候補）
${tests[chief].map(x=>"・"+x).join("\n")}

※模擬症例専用。臨床利用不可。`;

 const root=$("results");
 root.replaceChildren();

 const title=document.createElement("h2");
 title.textContent="問診結果";
 root.append(title);

 const badge=document.createElement("span");
 badge.className="tag "+level;
 badge.textContent=status;
 root.append(badge);

 if(danger.length){
  const p=document.createElement("p");
  p.textContent="該当する危険徴候："+danger.join("、");
  root.append(p);
 }

 if(chief==="dyspnea"){
  const warning=document.createElement("p");
  warning.className="warning";
  warning.textContent=
   "SpO₂が正常でも肺塞栓症、急性冠症候群などは除外できません。"+
   "呼吸数、呼吸仕事量、循環動態、意識状態などの評価が必要です。";
  root.append(warning);
 }

 if(hfNotes.length){
  const heading=document.createElement("h3");
  heading.textContent="心不全に関する参考評価";
  root.append(heading);

  const ul=document.createElement("ul");
  hfNotes.forEach(note=>{
   const li=document.createElement("li");
   li.textContent=note;
   ul.append(li);
  });
  root.append(ul);
 }

 const note=document.createElement("p");
 note.className="muted";
 note.textContent=
  "固定ルールによる教育用候補です。診断順位や確率ではありません。";
 root.append(note);

 appendDifferentials(root);

 const testTitle=document.createElement("h3");
 testTitle.textContent="検査・評価候補";
 root.append(testTitle);

 const ul=document.createElement("ul");
 tests[chief].forEach(t=>{
  const li=document.createElement("li");
  li.textContent=t;
  ul.append(li);
 });
 root.append(ul);

 const soapTitle=document.createElement("h3");
 soapTitle.textContent="SOAP下書き";
 root.append(soapTitle);

 const pre=document.createElement("pre");
 pre.textContent=soap;
 root.append(pre);

 const copy=document.createElement("button");
 copy.className="primary";
 copy.textContent="SOAPをコピー";
 copy.onclick=async()=>{
  try{
   await navigator.clipboard.writeText(soap);
   copy.textContent="コピーしました";
  }catch(e){
   copy.textContent="コピーできません。テキストを選択してください";
  }
 };
 root.append(copy);

 root.classList.remove("hidden");
 $("heading").textContent="問診完了";
 $("question").textContent="結果を確認してください";
 $("counter").textContent="模擬症例のみ";
 $("progress").style.width="100%";
 $("options").replaceChildren();
 $("next").classList.add("hidden");

 root.scrollIntoView({behavior:"smooth",block:"start"});
}

render();
</script>
