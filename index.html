
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Decision Assistant v1.2</title>
<style>
:root{
  font-family:system-ui,-apple-system,sans-serif;
  color:#172b42;
  background:#f3f6fa;
}
*{box-sizing:border-box}
body{margin:0}
header{
  background:#10243a;
  color:white;
  padding:20px;
}
header h1{font-size:20px;margin:0 0 5px}
header small{color:#c5d5e4}
main{max-width:850px;margin:22px auto;padding:0 14px}
.panel{
  background:white;
  border:1px solid #dbe3ed;
  border-radius:15px;
  padding:22px;
  margin-bottom:14px;
}
.muted{color:#607084;font-size:13px}
.options{display:grid;gap:10px;margin-top:18px}
.option{
  border:1px solid #cdd9e7;
  background:white;
  border-radius:10px;
  text-align:left;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  color:#142c44;
}
.option:hover,.option:focus{background:#e8f2ff}
.option.selected{
  background:#dceeff;
  border-color:#176cb5;
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
button{font:inherit}
.primary,.secondary{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  cursor:pointer;
}
.primary{background:#1268ac;color:white}
.secondary{background:#e8eef5;color:#17324d}
.progress{
  height:7px;
  background:#e4eaf2;
  border-radius:6px;
  overflow:hidden;
  margin-top:14px;
}
#progress{height:100%;background:#2c84bf;width:0}
.tag{
  display:inline-block;
  border-radius:30px;
  padding:6px 12px;
  background:#e9eff7;
  font-size:13px;
}
.red{color:#9c1d25;background:#ffebeb}
.yellow{color:#795900;background:#fff3c9}
.green{color:#12613a;background:#e4f7ed}
.warning{
  border-left:4px solid #d8a32c;
  padding:12px;
  background:#fff9e7;
  font-size:13px;
}
.disease-group{
  border:1px solid #dbe3ed;
  border-radius:10px;
  margin:9px 0;
  padding:10px 13px;
}
.disease-group summary{cursor:pointer;font-weight:bold}
.disease-item{margin:10px 0}
.disease-item button{
  border:0;
  background:#e8eef5;
  border-radius:6px;
  padding:7px 10px;
  cursor:pointer;
}
.subtype{
  margin:8px 0 8px 12px;
  padding:12px;
  background:#f5f8fc;
  border-radius:8px;
}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#f5f7fa;
  padding:14px;
  border-radius:10px;
  line-height:1.6;
  font-family:inherit;
}
.hidden{display:none}
li{margin:7px 0}
footer{text-align:center;color:#65758a;font-size:12px;padding:18px}
</style>
</head>
<body>

<header>
<h1>Clinical Decision Assistant <span class="tag">v1.2 DEMO</span></h1>
<small>医師向け選択式問診・診断支援｜模擬症例専用</small>
</header>

<main>
<section class="panel">
<strong id="heading">主訴を選択</strong>
<div class="progress"><div id="progress"></div></div>
<p id="counter" class="muted"></p>
<h2 id="question">主訴は何ですか？</h2>
<div id="options" class="options"></div>
<div class="actions">
<button class="secondary" id="back">戻る</button>
<button class="primary hidden" id="next">次へ</button>
<button class="secondary" id="restart">最初から</button>
</div>
</section>

<section id="results" class="panel hidden" aria-live="polite"></section>

<section class="warning">
教育・UI検証用の試作です。緊急度判定、鑑別疾患、検査候補は臨床的に検証されていません。
実患者への使用、個人情報の入力、診断・治療方針の決定には使用しないでください。
</section>
</main>

<footer>Static demo · GitHub Pages · No server · No external API</footer>

const $=id=>document.getElementById(id);

let chief=null;
let idx=0;
let answers={};
let selected=[];



function activeQuestions(){
  if(!chief)return [];
  return Q[chief].filter(q=>!q.when||q.when(answers));
}

// 質問IDと回答履歴で進行を管理する
let currentQuestionId=null;
let questionHistory=[];

function reset(){
  chief=null;
  idx=0;
  answers={};
  selected=[];
  currentQuestionId=null;
  questionHistory=[];
  $("results").classList.add("hidden");
  render();
}

function drawOptions(choices,multi,callback){
  $("options").replaceChildren();

  choices.forEach(choice=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="option"+
      (selected.includes(choice)?" selected":"");
    button.textContent=choice;
    button.setAttribute(
      "aria-pressed",
      String(selected.includes(choice))
    );
    button.onclick=()=>callback(choice);
    $("options").append(button);
  });
}

function render(){
  $("results").classList.add("hidden");
  $("next").classList.add("hidden");

  if(!chief){
    $("heading").textContent="主訴を選択";
    $("counter").textContent="主訴を選択してください";
    $("question").textContent="主訴は何ですか？";
    $("progress").style.width="0%";
    $("back").disabled=true;

    selected=[];

    drawOptions(Object.values(names),false,choice=>{
      chief=Object.keys(names).find(
        key=>names[key]===choice
      );
      answers={};
      questionHistory=[];
      currentQuestionId=Q[chief][0].id;
      render();
    });
    return;
  }

  $("back").disabled=false;

  const questions=activeQuestions();
  const position=questions.findIndex(
    q=>q.id===currentQuestionId
  );

  if(position<0){
    // 条件変更で質問が消えた場合は先頭に戻す
    currentQuestionId=questions[0].id;
    render();
    return;
  }

  idx=position;
  const q=questions[position];

  $("heading").textContent=
    names[chief]+"：選択式問診";
  $("counter").textContent=
    `質問 ${position+1} / ${questions.length}`;
  $("progress").style.width=
    `${100*position/questions.length}%`;

  $("question").textContent=
    q.label+(q.multi?"（複数選択可）":"");

  selected=Array.isArray(answers[q.id])
    ?[...answers[q.id]]
    :[];

  function handleChoice(choice){
    if(q.multi){
      if(choice==="なし"||choice==="未評価"){
        selected=[choice];
      }else{
        selected=selected.filter(
          x=>x!=="なし"&&x!=="未評価"
        );
        selected=selected.includes(choice)
          ?selected.filter(x=>x!==choice)
          :[...selected,choice];
      }

      drawOptions(q.choices,true,handleChoice);
      $("next").classList.toggle(
        "hidden",selected.length===0
      );
    }else{
      answers[q.id]=choice;
      goNext();
    }
  }

  drawOptions(q.choices,!!q.multi,handleChoice);

  if(q.multi){
    $("next").classList.toggle(
      "hidden",selected.length===0
    );
  }
}

function goNext(){
  const questions=activeQuestions();
  const position=questions.findIndex(
    q=>q.id===currentQuestionId
  );

  if(position<0){
    alert("質問の位置を確認できません。");
    return;
  }

  const nextQuestion=questions[position+1];

  if(nextQuestion){
    questionHistory.push(currentQuestionId);
    currentQuestionId=nextQuestion.id;
    render();
  }else{
    showResults();
  }
}

$("next").onclick=()=>{
  if(!chief||!currentQuestionId||!selected.length){
    return;
  }

  answers[currentQuestionId]=[...selected];
  goNext();
};

$("back").onclick=()=>{
  if(!chief)return;

  if(questionHistory.length===0){
    reset();
    return;
  }

  currentQuestionId=questionHistory.pop();
  render();
};

$("restart").onclick=reset;
  


function appendDifferentials(root){
  const heading=document.createElement("h3");
  heading.textContent="カテゴリー別鑑別候補";
  root.append(heading);

  diseaseGroups[chief].forEach(([group,items])=>{
    const details=document.createElement("details");
    details.className="disease-group";
    details.open=true;

    const summary=document.createElement("summary");
    summary.textContent=group;
    details.append(summary);

    items.forEach(name=>{
      const item=document.createElement("div");
      item.className="disease-item";

      const button=document.createElement("button");
      button.textContent=name+" ▾";

      const info=document.createElement("div");
      info.className="subtype hidden";

      const detail=diseaseDetails[name];

      if(detail){
        const overview=document.createElement("p");
        overview.textContent=detail.overview;
        info.append(overview);

        detail.dimensions.forEach(([label,values])=>{
          const title=document.createElement("strong");
          title.textContent=label;
          info.append(title);

          const ul=document.createElement("ul");
          values.forEach(value=>{
            const li=document.createElement("li");
            li.textContent=value;
            ul.append(li);
          });
          info.append(ul);
        });

        const title=document.createElement("strong");
        title.textContent="追加問診・評価項目";
        info.append(title);

        const ul=document.createElement("ul");
        detail.followup.forEach(value=>{
          const li=document.createElement("li");
          li.textContent=value;
          ul.append(li);
        });
        info.append(ul);
      }else{
        info.textContent="詳細分類は今後追加予定。確定診断ではありません。";
      }

      button.onclick=()=>{
        info.classList.toggle("hidden");
        button.textContent=name+(info.classList.contains("hidden")?" ▾":" ▴");
      };

      item.append(button,info);
      details.append(item);
    });

    root.append(details);
  });
}

function showResults(){
  const all=Object.values(answers).flat();
  const danger=red[chief].filter(x=>all.includes(x));

  const lowOxygen=chief==="dyspnea" &&
    ["90%未満","90〜93%"].includes(answers.spo2);

  const unknown=all.includes("未評価")||all.includes("未測定");

  const caution=
    chief==="dyspnea"||
    chief==="chest"||
    (chief==="headache"&&answers.onset==="突然（瞬時にピーク）")||
    (chief==="abdomen"&&answers.onset==="突然")||
    (chief==="cough"&&answers.type==="血痰あり")||
    all.includes("39℃以上");

  const level=danger.length||lowOxygen
    ?"red"
    :unknown||caution?"yellow":"green";

  const status=level==="red"
    ?"危険徴候あり：緊急評価を要する可能性"
    :level==="yellow"
      ?"追加評価が必要：重症疾患は除外不能"
      :"入力された項目に明らかな危険徴候なし（除外不能）";

  const history=activeQuestions().map(q=>{
    const value=answers[q.id];
    return q.label+"："+(
      Array.isArray(value)?value.join("、"):value||"未回答"
    );
  }).join("\n");

  const differential=diseaseGroups[chief]
    .flatMap(group=>group[1]).join("、");

  const soap=
`S（主観的情報）
主訴：${names[chief]}
${history}

O（客観的情報）
バイタル・身体診察・検査所見：
問診選択肢以外は未入力／未評価
※SpO₂の選択回答はS欄に記録。実測値として未検証。

A（評価：確定診断ではない）
注意喚起：${status}
鑑別候補（順位・確率ではない）：
${differential}

P（評価・検査の候補）
${tests[chief].map(x=>"・"+x).join("\n")}

※模擬症例専用。臨床利用不可。`;

  const root=$("results");
  root.replaceChildren();

  const title=document.createElement("h2");
  title.textContent="問診結果";
  root.append(title);

  const badge=document.createElement("span");
  badge.className="tag "+level;
  badge.textContent=status;
  root.append(badge);

  if(danger.length){
    const p=document.createElement("p");
    p.textContent="該当する危険徴候："+danger.join("、");
    root.append(p);
  }

  if(chief==="dyspnea"){
    const warning=document.createElement("p");
    warning.className="warning";
    warning.textContent=
      "呼吸困難では、SpO₂が正常でも肺塞栓症・急性冠症候群などは除外できません。"+
      "意識、呼吸仕事量、循環動態、呼吸数、酸素投与条件などの評価が必要です。";
    root.append(warning);
  }

  const note=document.createElement("p");
  note.className="muted";
  note.textContent=
    "固定ルールによる教育用表示です。診断確率・優先順位・臨床的安全性は検証されていません。";
  root.append(note);

  appendDifferentials(root);

  const testTitle=document.createElement("h3");
  testTitle.textContent="検査・評価候補";
  root.append(testTitle);

  const ul=document.createElement("ul");
  tests[chief].forEach(value=>{
    const li=document.createElement("li");
    li.textContent=value;
    ul.append(li);
  });
  root.append(ul);

  const soapTitle=document.createElement("h3");
  soapTitle.textContent="SOAP下書き";
  root.append(soapTitle);

  const pre=document.createElement("pre");
  pre.textContent=soap;
  root.append(pre);

  const copy=document.createElement("button");
  copy.className="primary";
  copy.textContent="SOAPをコピー";

  copy.onclick=async()=>{
    try{
      await navigator.clipboard.writeText(soap);
      copy.textContent="コピーしました";
    }catch(e){
      copy.textContent="コピーできません。テキストを選択してください";
    }
  };

  root.append(copy);
  root.classList.remove("hidden");

  $("heading").textContent="問診完了";
  $("question").textContent="結果を確認してください";
  $("counter").textContent="模擬症例のみ";
  $("progress").style.width="100%";
  $("options").replaceChildren();
  $("next").classList.add("hidden");

  root.scrollIntoView({behavior:"smooth",block:"start"});
}

render();
</script>
</body>
